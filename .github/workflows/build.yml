name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
      - name: Fix Kotlin version conflict
        run: sed -i "s|dependencies {|dependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')|" proj/app/build.gradle
        run: unzip -q DailyNotebook-android.zip -d proj
      - name: Test JSON and PDF saving logic
        run: node proj/tools/test-bridge.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Bundle PDF libraries
        working-directory: proj
        run: |
          mkdir -p app/src/main/assets/libs
          curl -fL -o app/src/main/assets/libs/html2canvas.min.js https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js
          curl -fL -o app/src/main/assets/libs/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DailyNotebook-apk
          path: proj/app/build/outputs/apk/debug/*.apk
